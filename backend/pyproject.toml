[project]
name = "merge-hunt"
version = "0.1.0"
description = "Finds mid-sized, active GitHub repositories that merge outside contributions and suggests issues to pick up."
authors = [
    { name = "ayanburak", email = "110117651+ayanburak@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
