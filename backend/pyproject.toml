[project]
name = "merge-hunt"
version = "0.1.0"
description = "Finds mid-sized, active GitHub repositories that merge outside contributions and suggests issues to pick up."
authors = [
    { name = "ayanburak", email = "110117651+ayanburak@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
